# Publishes the no-wallet demo (ui/demo.html) to GitHub Pages.
# Only the demo is published; the real app needs a wallet and proof server
# and is run locally (see README).
name: Demo page

# Manual for now: Pages on a free account needs a public repo, and this repo
# stays private until submission. After it goes public, run it once with
#   gh workflow run demo-pages.yml
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The Wave 2 replay demo (ui/ + api/) is built on the ledger 8 stack. Since the ledger 9 migration it is no
      # longer a workspace, so build it from the last commit that had it as one.
      - uses: actions/checkout@v4
        with:
          ref: 7d7a8e1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo -w mandate-ui
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
